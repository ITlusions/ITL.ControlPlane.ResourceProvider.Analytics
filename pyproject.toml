[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itl-analytics-provider"
version = "0.1.0"
description = "ITL Analytics Resource Provider for Control Plane - Notebooks, Spark Clusters, Jobs, Models"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "ITLusions", email = "engineering@itlusions.com"}
]

dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.25",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "itl-controlplane-sdk>=1.0.0",
    "kubernetes>=29.0.0",
    "minio>=7.2.0",
    "sqlalchemy-json>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "black>=23.7",
    "ruff>=0.1",
    "mypy>=1.5",
    "httpx-mock>=0.3",
]

[project.scripts]
analytics-provider = "itl_analytics_provider.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
